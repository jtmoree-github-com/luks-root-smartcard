# luks-root-smartcard initramfs asset inclusion mode.
#
# Evaluated at initramfs generation time (update-initramfs / mkinitramfs),
# not at package build time. Change this file and rebuild the initramfs to
# switch modes after install:
#   sudo update-initramfs -u -k "$(uname -r)"
#
# Values:
#   all      - Copy assets for all workflows (TPM2, FIDO2, PKCS#11, GPG) into
#              the initramfs, regardless of which tokens are enrolled. Lets you
#              enroll a new token type later without missing runtime support.
#              (default)
#   detected - Copy only assets for token types found in the root LUKS2 header
#              at generation time. Smaller initramfs; rebuild after enrolling a
#              new token type.
#
# For a one-off override without editing this file:
#   sudo SMARTCARD_INITRAMFS_INCLUDE=detected update-initramfs -u -k "$(uname -r)"

SMARTCARD_INITRAMFS_INCLUDE=all
